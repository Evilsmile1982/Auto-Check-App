<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020203">
<title>Auto Check</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020203;font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:480px;height:100dvh;overflow:hidden;background:#020203 url("./auto-check-mobile-bg.jpg") center top/100% auto no-repeat}
.nav{position:absolute;z-index:10;left:7px;right:7px;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.nav button{appearance:none;border:1px solid rgba(170,170,170,.32);min-width:0;height:84px;border-radius:13px;padding:7px 2px;color:#eee;background:linear-gradient(145deg,rgba(35,35,38,.97),rgba(8,8,10,.98));box-shadow:inset 0 1px rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.7);display:flex;flex-direction:column;align-items:center;justify-content:space-between}
.nav button.active{border-color:#ff1828;box-shadow:inset 0 1px rgba(255,255,255,.1),0 0 13px rgba(255,0,20,.45),0 6px 20px rgba(0,0,0,.8)}
.icon{width:29px;height:29px;display:grid;place-items:center}
.icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.label{width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(6px,1.85vw,9px);font-weight:700;letter-spacing:.35px}
.nav button:nth-child(-n+3){opacity:0;transform:translateX(-140px);animation:leftIn 2s cubic-bezier(.16,.84,.25,1) forwards}
.nav button:nth-child(n+4){opacity:0;transform:translateX(140px);animation:rightIn 2s cubic-bezier(.16,.84,.25,1) forwards}
.nav button:nth-child(1),.nav button:nth-child(6){animation-delay:.05s}
.nav button:nth-child(2),.nav button:nth-child(5){animation-delay:.12s}
.nav button:nth-child(3),.nav button:nth-child(4){animation-delay:.19s}
@keyframes leftIn{0%{opacity:0;transform:translateX(-140px)}65%{opacity:1}100%{opacity:1;transform:translateX(0)}}
@keyframes rightIn{0%{opacity:0;transform:translateX(140px)}65%{opacity:1}100%{opacity:1;transform:translateX(0)}}
@media(max-height:680px){.nav{bottom:7px}.nav button{height:72px;border-radius:11px}.icon{width:24px;height:24px}.label{font-size:6px}}
</style>
</head>
<body>
<div class="app">
<nav class="nav">
<button class="active"><span class="icon"><svg viewBox="0 0 32 32"><path d="M5 19l2-7c.5-2 2-3 4-3h10c2 0 3.5 1 4 3l2 7"/><path d="M4 19v6h3v-3h18v3h3v-6"/><path d="M9 19h14"/><circle cx="9" cy="19" r="1.5"/><circle cx="23" cy="19" r="1.5"/></svg></span><span class="label">MEIN AUTO</span></button>
<button><span class="icon"><svg viewBox="0 0 32 32"><path d="M19 5a6 6 0 0 0-7 7L5 19l8 8 7-7a6 6 0 0 0 7-7l-4 4-4-1-1-4 4-4z"/></svg></span><span class="label">REPARATUREN</span></button>
<button><span class="icon"><svg viewBox="0 0 32 32"><rect x="6" y="7" width="20" height="20" rx="2"/><path d="M10 4v6M22 4v6M6 13h20"/><path d="M11 18h2M17 18h2M11 23h2M17 23h2"/></svg></span><span class="label">WARTUNGEN</span></button>
<button><span class="icon"><svg viewBox="0 0 32 32"><rect x="7" y="4" width="18" height="24" rx="2"/><path d="M11 11h10M11 16h10M11 21h7"/></svg></span><span class="label">KOSTEN</span></button>
<button><span class="icon"><svg viewBox="0 0 32 32"><path d="M6 27V17M12 27V11M18 27V5M24 27V14"/></svg></span><span class="label">STATISTIK</span></button>
<button><span class="icon"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="5"/><path d="M16 3v4M16 25v4M3 16h4M25 16h4M6.8 6.8l2.8 2.8M22.4 22.4l2.8 2.8M25.2 6.8l-2.8 2.8M9.6 22.4l-2.8 2.8"/></svg></span><span class="label">EINSTELLUNGEN</span></button>
</nav>
</div>
<script>
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");
}));
</script>
</body>
</html>
