<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050505">
<title>Auto Check</title>

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030303;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    display: flex;
    justify-content: center;
  }

  /* Nur Handy-Layout */
  .app {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100dvh;
    min-height: 600px;
    overflow: hidden;
    color: #fff;
    background:
      linear-gradient(to bottom,
        rgba(0,0,0,.28) 0%,
        rgba(0,0,0,.02) 38%,
        rgba(0,0,0,.20) 64%,
        #030303 100%
      ),
      url("./car-bg.jpg") center 43% / cover no-repeat;
  }

  /* Roter Werkstatt-Schein */
  .app::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 35%, transparent 25%, rgba(0,0,0,.18) 68%, rgba(0,0,0,.65) 100%),
      linear-gradient(to bottom, transparent 55%, rgba(0,0,0,.88) 88%, #020202 100%);
    z-index: 1;
  }

  /* =========================
     LOGO
     ========================= */
  .brand {
    position: absolute;
    z-index: 5;
    top: 4.5%;
    left: 50%;
    width: 92%;
    transform: translateX(-50%) translateY(-140%);
    text-align: center;
    animation: brandDrop 2s cubic-bezier(.18,.85,.25,1) forwards;
  }

  .gear {
    width: 54px;
    height: 54px;
    margin: 0 auto 4px;
    border: 6px solid #bfc3c7;
    border-radius: 50%;
    position: relative;
    box-shadow:
      0 0 12px rgba(255,255,255,.25),
      0 0 18px rgba(255,0,0,.32);
  }

  .gear::before {
    content: "⚒";
    position: absolute;
    inset: -2px;
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 29px;
    transform: rotate(-15deg);
  }

  .brand-title {
    font-size: clamp(31px, 10vw, 52px);
    line-height: .88;
    font-weight: 950;
    font-style: italic;
    letter-spacing: -2px;
    text-transform: uppercase;
    color: #f1f1f1;
    text-shadow: 0 3px 10px #000;
  }

  .brand-title span {
    color: #e50012;
    text-shadow:
      0 0 10px rgba(255,0,0,.45),
      0 3px 10px #000;
  }

  .tagline {
    margin-top: 10px;
    font-size: 8px;
    letter-spacing: 4px;
    font-weight: 600;
    color: #eee;
    opacity: .9;
  }

  /* =========================
     CREATET BY D.M.
     ========================= */
  .creator {
    position: absolute;
    z-index: 4;
    right: 6%;
    top: 42%;
    transform: rotate(-5deg);
    color: rgba(255,255,255,.20);
    font-size: 12px;
    letter-spacing: 2px;
    font-weight: 800;
    text-transform: uppercase;
    text-shadow: 0 1px 5px #000;
  }

  /* =========================
     NAVIGATION
     ========================= */
  .nav {
    position: absolute;
    z-index: 10;
    left: 7px;
    right: 7px;
    bottom: max(13px, env(safe-area-inset-bottom));
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 5px;
    align-items: end;
  }

  .nav-button {
    appearance: none;
    border: 1px solid rgba(170,170,170,.30);
    min-width: 0;
    height: 82px;
    border-radius: 13px;
    padding: 8px 2px 7px;
    color: #f4f4f4;
    background:
      linear-gradient(145deg, rgba(40,40,43,.94), rgba(10,10,12,.97));
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.08),
      0 7px 20px rgba(0,0,0,.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: .2s ease;
  }

  .nav-button:active {
    transform: translateY(2px) scale(.97);
  }

  .nav-button.active {
    border-color: #ff1727;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.10),
      0 0 12px rgba(255,0,20,.45),
      0 7px 22px rgba(0,0,0,.7);
  }

  .icon {
    width: 29px;
    height: 29px;
    margin-top: 1px;
    display: grid;
    place-items: center;
    color: #eee;
  }

  .icon svg {
    width: 100%;
    height: 100%;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .label {
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    text-align: center;
    font-size: clamp(6px, 1.8vw, 9px);
    font-weight: 700;
    letter-spacing: .5px;
  }

  /* 3 von links */
  .nav-button:nth-child(1),
  .nav-button:nth-child(2),
  .nav-button:nth-child(3) {
    opacity: 0;
    transform: translateX(-130px);
    animation: slideLeft 2s cubic-bezier(.18,.85,.25,1) forwards;
  }

  /* 3 von rechts */
  .nav-button:nth-child(4),
  .nav-button:nth-child(5),
  .nav-button:nth-child(6) {
    opacity: 0;
    transform: translateX(130px);
    animation: slideRight 2s cubic-bezier(.18,.85,.25,1) forwards;
  }

  .nav-button:nth-child(1),
  .nav-button:nth-child(6) { animation-delay: .05s; }

  .nav-button:nth-child(2),
  .nav-button:nth-child(5) { animation-delay: .12s; }

  .nav-button:nth-child(3),
  .nav-button:nth-child(4) { animation-delay: .19s; }

  @keyframes brandDrop {
    0% {
      opacity: 0;
      transform: translateX(-50%) translateY(-140%);
    }
    65% {
      opacity: 1;
    }
    100% {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  }

  @keyframes slideLeft {
    0% {
      opacity: 0;
      transform: translateX(-130px);
    }
    65% { opacity: 1; }
    100% {
      opacity: 1;
      transform: translateX(0);
    }
  }

  @keyframes slideRight {
    0% {
      opacity: 0;
      transform: translateX(130px);
    }
    65% { opacity: 1; }
    100% {
      opacity: 1;
      transform: translateX(0);
    }
  }

  /* Sehr kleine Handys */
  @media (max-height: 680px) {
    .brand { top: 2.5%; }
    .gear { width: 42px; height: 42px; border-width: 5px; }
    .gear::before { font-size: 22px; }
    .brand-title { font-size: 29px; }
    .tagline { margin-top: 6px; font-size: 6px; }
    .creator { top: 41%; }
    .nav { bottom: 8px; }
    .nav-button { height: 70px; border-radius: 11px; }
    .icon { width: 24px; height: 24px; }
    .label { font-size: 6px; }
  }

  /* Tablet/Desktop bewusst nicht ausdehnen */
  @media (min-width: 481px) {
    body {
      background: #000;
    }
    .app {
      box-shadow: 0 0 60px rgba(0,0,0,.9);
    }
  }
</style>
</head>

<body>
<div class="app">

  <header class="brand">
    <div class="gear">⚒</div>
    <div class="brand-title">AUTO <span>CHECK</span></div>
    <div class="tagline">VERLIERE NICHT DIE ÜBERSICHT</div>
  </header>

  <!-- Unauffällig wie das Logo an der Werkstattwand -->
  <div class="creator">CREATED BY D.M.</div>

  <nav class="nav" aria-label="Hauptmenü">

    <button class="nav-button active">
      <span class="icon">
        <svg viewBox="0 0 32 32">
          <path d="M5 19l2-7c.5-2 2-3 4-3h10c2 0 3.5 1 4 3l2 7"/>
          <path d="M4 19v6h3v-3h18v3h3v-6"/>
          <path d="M9 19h14"/>
          <circle cx="9" cy="19" r="1.5"/>
          <circle cx="23" cy="19" r="1.5"/>
        </svg>
      </span>
      <span class="label">MEIN AUTO</span>
    </button>

    <button class="nav-button">
      <span class="icon">
        <svg viewBox="0 0 32 32">
          <path d="M19 5a6 6 0 0 0-7 7L5 19l8 8 7-7a6 6 0 0 0 7-7l-4 4-4-1-1-4 4-4z"/>
        </svg>
      </span>
      <span class="label">REPARATUREN</span>
    </button>

    <button class="nav-button">
      <span class="icon">
        <svg viewBox="0 0 32 32">
          <rect x="6" y="7" width="20" height="20" rx="2"/>
          <path d="M10 4v6M22 4v6M6 13h20"/>
          <path d="M11 18h2M17 18h2M11 23h2M17 23h2"/>
        </svg>
      </span>
      <span class="label">WARTUNGEN</span>
    </button>

    <button class="nav-button">
      <span class="icon">
        <svg viewBox="0 0 32 32">
          <rect x="7" y="4" width="18" height="24" rx="2"/>
          <path d="M11 11h10M11 16h10M11 21h7"/>
        </svg>
      </span>
      <span class="label">KOSTEN</span>
    </button>

    <button class="nav-button">
      <span class="icon">
        <svg viewBox="0 0 32 32">
          <path d="M6 27V17M12 27V11M18 27V5M24 27V14"/>
        </svg>
      </span>
      <span class="label">STATISTIK</span>
    </button>

    <button class="nav-button">
      <span class="icon">
        <svg viewBox="0 0 32 32">
          <circle cx="16" cy="16" r="5"/>
          <path d="M16 3v4M16 25v4M3 16h4M25 16h4M6.8 6.8l2.8 2.8M22.4 22.4l2.8 2.8M25.2 6.8l-2.8 2.8M9.6 22.4l-2.8 2.8"/>
        </svg>
      </span>
      <span class="label">EINSTELLUNGEN</span>
    </button>

  </nav>
</div>

<script>
  // Buttons sind vorbereitet; hier kannst du später deine Seiten/Funktionen verknüpfen.
  document.querySelectorAll(".nav-button").forEach(button => {
    button.addEventListener("click", () => {
      document.querySelectorAll(".nav-button").forEach(b => b.classList.remove("active"));
      button.classList.add("active");
    });
  });
</script>
</body>
</html>
