 transform:scale(1.12);
 filter:brightness(.18) contrast(1.15);
 animation:sceneIn 8s cubic-bezier(.2,.7,.2,1) forwards;
}
.scene:after{
 content:"";position:absolute;inset:0;
 background:linear-gradient(180deg,rgba(0,0,0,.70),rgba(0,0,0,.08) 42%,rgba(0,0,0,.90));
}
@keyframes sceneIn{
 0%{transform:scale(1.20);filter:brightness(.05) contrast(1.2)}
 18%{filter:brightness(.30) contrast(1.15)}
 42%{transform:scale(1.12);filter:brightness(.65) contrast(1.08)}
 100%{transform:scale(1);filter:brightness(.78) contrast(1.08)}
}

.shade{position:absolute;inset:0;background:#000;z-index:3;animation:fade 2.2s ease forwards;pointer-events:none}
@keyframes fade{to{opacity:0}}

.headlights{
 position:absolute;left:50%;top:48%;width:72vw;max-width:430px;height:90px;
 transform:translate(-50%,-50%);z-index:5;opacity:0;
 animation:lights 2.5s ease .4s forwards;
}
.hl{position:absolute;top:30px;width:100px;height:20px;background:#efffff;border-radius:50%;
 box-shadow:0 0 12px #fff,0 0 35px #55d7ff,0 0 85px #168cff}
.hl.l{left:0;transform:rotate(8deg)}.hl.r{right:0;transform:scaleX(-1) rotate(8deg)}
@keyframes lights{
 0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}
 35%{opacity:1}
 100%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}
}

.burnout{
 position:absolute;left:50%;bottom:26%;width:70vw;height:130px;
 transform:translateX(-50%) scale(.35);opacity:0;z-index:7;
 background:radial-gradient(ellipse,rgba(255,255,255,.55),transparent 68%);
 filter:blur(10px);
 animation:burn 4.7s ease 2.7s forwards;
}
@keyframes burn{
 0%{opacity:0;transform:translateX(-50%) scale(.35)}
 15%{opacity:.9}
 42%{opacity:.72;transform:translateX(-50%) scale(1.05)}
 100%{opacity:0;transform:translateX(-50%) scale(1.55)}
}

.smoke{
 position:absolute;left:-10%;bottom:13%;width:120%;height:52%;z-index:8;
 pointer-events:none;opacity:0;filter:blur(8px);
 background:radial-gradient(ellipse at 50% 70%,rgba(240,240,240,.68),rgba(160,160,160,.25) 34%,rgba(90,90,90,.10) 55%,transparent 74%);
 animation:smoke 7s ease 2.8s forwards;
}
.smoke:before,.smoke:after{content:"";position:absolute;border-radius:50%;filter:blur(22px);background:rgba(240,240,240,.30)}
.smoke:before{width:48%;height:70%;left:5%;bottom:0}
.smoke:after{width:52%;height:72%;right:4%;bottom:3%}
@keyframes smoke{
 0%{opacity:0;transform:scale(.65) translateY(35px)}
 18%{opacity:.9;transform:scale(1) translateY(0)}
 55%{opacity:.58;transform:scale(1.12) translateY(-15px)}
 100%{opacity:0;transform:scale(1.38) translateY(-80px)}
}

.flash{
 position:absolute;inset:0;background:rgba(255,20,20,.10);z-index:9;opacity:0;
 animation:flash .35s ease 4.4s 2;
 pointer-events:none
}
@keyframes flash{50%{opacity:1}}

.creator{
 position:absolute;right:5%;top:14%;z-index:15;
 background:rgba(255,255,255,.94);color:#111;
 padding:7px 13px;border-radius:2px;box-shadow:0 5px 20px #0009;
 transform:rotate(-2deg);opacity:0;
 animation:creator 1s ease 5.8s forwards;
 font-size:11px;font-weight:900;letter-spacing:.7px;
}
@keyframes creator{to{opacity:1}}

.menu{
 position:absolute;left:50%;bottom:2.3%;z-index:25;
 width:96%;max-width:900px;
 display:grid;grid-template-columns:repeat(6,1fr);gap:8px;
 transform:translate(-50%,130px);opacity:0;
 animation:menuIn 1.15s cubic-bezier(.2,.8,.2,1) 7.2s forwards;
}
.menu button{
 min-height:78px;border:1px solid #444;border-radius:14px;
 background:linear-gradient(145deg,rgba(25,29,33,.97),rgba(3,5,7,.97));
 box-shadow:0 8px 26px #000b,inset 0 1px rgba(255,255,255,.08);
 font-weight:800;font-size:clamp(8px,2.1vw,14px);cursor:pointer;
 transition:transform .18s,box-shadow .18s,border .18s;
}
.menu button:first-child{
 border-color:#ff202a;background:linear-gradient(145deg,#d71923,#65070b);
 box-shadow:0 0 28px #e51b2355;
}
.menu button:active{transform:scale(.95)}
.ico{display:block;font-size:24px;margin-bottom:6px}
@keyframes menuIn{to{opacity:1;transform:translate(-50%,0)}}

.submenu{
 position:absolute;left:50%;bottom:18%;z-index:40;width:92%;max-width:540px;
 background:rgba(6,8,10,.97);border:1px solid #4a4a4a;border-radius:20px;
 padding:20px;box-shadow:0 25px 70px #000;
 transform:translate(-50%,30px) scale(.96);opacity:0;pointer-events:none;
 transition:.28s;
}
.submenu.open{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
.submenu h2{font-size:24px;margin-bottom:14px}
.subgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.subgrid button{
 padding:14px;border:1px solid #333;border-radius:12px;
 background:#15191d;text-align:left;font-weight:700;
}
.close{position:absolute;right:12px;top:8px;background:none;border:0;font-size:27px}

@media(max-width:700px){
 .menu{grid-template-columns:repeat(3,1fr);gap:6px}
 .menu button{min-height:62px;font-size:10px}
 .ico{font-size:21px}
 .submenu{bottom:23%}
 .creator{top:17%;right:4%;font-size:10px}
}
</style>
</head>
<body>
<div id="app">
  <div class="scene"></div>
  <div class="shade"></div>
  <div class="headlights"><i class="hl l"></i><i class="hl r"></i></div>
  <div class="burnout"></div>
  <div class="smoke"></div>
  <div class="flash"></div>

  <div class="creator">Created by D.M.</div>
